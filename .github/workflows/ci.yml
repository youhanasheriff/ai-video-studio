name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      # apps/web is a standalone pnpm project with its own lockfile (lockfileVersion 9.0).
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          # Root package.json pins pnpm@8, which cannot read apps/web's v9 lockfile.
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  api:
    name: API (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only ruff is installed: requirements.txt pulls video-composer from Git
      # and heavy media dependencies that linting does not need.
      - name: Install ruff
        run: pip install ruff

      # Restricted to pycodestyle errors and pyflakes. The full default ruff
      # rule set currently reports many stylistic findings in the existing code.
      - name: Lint
        run: ruff check --isolated --select E4,E7,E9,F .

      # apps/api has no test suite yet, so no pytest step is run.
